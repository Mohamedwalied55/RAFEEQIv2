name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Build web app
        env:
          VITE_API_BASE_URL: https://rafeeqi-ai.waliedm756.workers.dev
          VITE_FIREBASE_API_KEY: AIzaSyCqzP7UgtCL2rP-FxLTiK28Qc71DUdi1No
          VITE_FIREBASE_AUTH_DOMAIN: rafeeqi-c8c57.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: rafeeqi-c8c57
          VITE_FIREBASE_STORAGE_BUCKET: rafeeqi-c8c57.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: "695756136896"
          VITE_FIREBASE_APP_ID: 1:695756136896:web:84cc96500f3a6280af2825
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: Patch permissions, alarm sound and launcher icon
        run: node scripts/patch-android.mjs

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rafeeqi-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
